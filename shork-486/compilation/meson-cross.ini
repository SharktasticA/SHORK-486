[binaries]
c = '@CC_STATIC@'
cpp = '@CXX_STATIC@'
ar = '@AR@'
strip = '@STRIP@'
pkgconfig = 'pkg-config'

[host_machine]
system = 'linux'
cpu_family = '@ARCH@'
cpu = '@ARCH@'
endian = 'little'

[built-in options]
default_library = 'static'
c_args = ['-static', '-fno-pie', '-fno-pic', '-mno-fancy-math-387', '-msoft-float', '-mno-80387', '-mno-fp-ret-in-387', '-D__gnuc_va_list=va_list', '-I@SYSROOT@/usr/include']
c_link_args = ['-static', '-static-libgcc', '-no-pie', '-L@PREFIX@/lib', '-L@SYSROOT@/lib', '-L@SYSROOT@/usr/lib', '-lsoftfp']
