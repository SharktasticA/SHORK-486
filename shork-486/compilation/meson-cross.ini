[binaries]
c = '@CC_STATIC@'
cpp = '@CXX_STATIC@'
ar = '@AR@'
strip = '@STRIP@'
pkgconfig = 'pkg-config'

[host_machine]
system = 'linux'
cpu_family = 'x86'
cpu = '@ARCH@'
endian = 'little'

[properties]
needs_exe_wrapper = false

[built-in options]
default_library = 'static'
c_args = ['-static', '-fno-pie', '-fno-pic', '-mno-fancy-math-387', '-msoft-float', '-mno-80387', '-mno-fp-ret-in-387', '-mlong-double-64', '-D__gnuc_va_list=va_list', '-I@SYSROOT@/usr/include']
c_link_args = ['-static', '-static-libgcc', '-no-pie', '-L@PREFIX@/lib', '-L@SYSROOT@/lib', '-L@SYSROOT@/usr/lib', '-lsoftfp']

[cmake]
CMAKE_FIND_ROOT_PATH_MODE_PROGRAM = 'NEVER'
CMAKE_FIND_ROOT_PATH_MODE_LIBRARY = 'ONLY'
CMAKE_FIND_ROOT_PATH_MODE_INCLUDE = 'ONLY'
CMAKE_FIND_ROOT_PATH_MODE_PACKAGE = 'ONLY'
