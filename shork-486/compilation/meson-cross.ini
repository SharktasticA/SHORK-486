[binaries]
c = '@CC_STATIC@'
cpp = '@CXX_STATIC@'
ar = '@AR@'
strip = '@STRIP@'
pkgconfig = 'pkg-config'

[host_machine]
system = 'linux'
cpu_family = 'x86'
cpu = '@ARCH@'
endian = 'little'

[properties]
needs_exe_wrapper = false

[built-in options]
default_library = 'static'
c_args = ['-static', '-Os', '-m32', '-march=@ARCH@', '-mtune=@ARCH@', '-mhard-float', '-g', '-ffunction-sections', '-fdata-sections', '-D__gnuc_va_list=va_list', '-D__NR_landlock_create_ruleset=444', '-D__NR_landlock_add_rule=445', '-D__NR_landlock_restrict_self=446', '--sysroot=@SYSROOT@', '-I@SYSROOT@/usr/include', '-fcommon', '-no-pie', '-fno-pie', '-fno-pic']
c_link_args = ['-static', '-static-libgcc', '-no-pie', '-L@PREFIX@/lib', '-L@SYSROOT@/lib', '-L@SYSROOT@/usr/lib']

[cmake]
CMAKE_FIND_ROOT_PATH_MODE_PROGRAM = 'NEVER'
CMAKE_FIND_ROOT_PATH_MODE_LIBRARY = 'ONLY'
CMAKE_FIND_ROOT_PATH_MODE_INCLUDE = 'ONLY'
CMAKE_FIND_ROOT_PATH_MODE_PACKAGE = 'ONLY'
